name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build installer
        run: ./gradlew packageDistributionForCurrentOS -PappVersion=${{ github.ref_name }} --no-daemon
        shell: bash

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/compose/binaries/main/*/*